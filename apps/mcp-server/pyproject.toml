[project]
name = "tessera-mcp"
version = "0.1.0"
description = "Tessera MCP gateway: a manifest-driven, tenant-aware MCP server that exposes SMB tools to AI assistants (docs/mcp/README.md)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.12.0",
    "mcp>=2.0,<3",
    "pyjwt>=2.13.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "cryptography>=44.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_mcp"]