[project]
name = "tessera-mcp"
version = "0.1.0"
description = "Tessera MCP server — the bridge between AI assistants and the Tessera platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
tessera-mcp = "tessera_mcp.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
anyio_mode = "auto"
markers = [
    "integration: live tests that need a running Tessera platform",
]
